name: PR Quality Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check Code Formatting
        run: mvn spotless:check

      - name: SpotBugs Analysis
        run: mvn spotbugs:check

  tests:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

  preview-test:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Wait for Render Preview
        run: |
          echo "Waiting for Render preview to be ready..."
          sleep 60
          echo "Render preview should be available at: https://cognitus-classes-pr-${{ github.event.number }}.onrender.com"

      - name: Test Preview Endpoint
        run: |
          PREVIEW_URL="https://cognitus-classes-pr-${{ github.event.number }}.onrender.com"
          echo "Testing $PREVIEW_URL"
          curl -f "$PREVIEW_URL" || (echo "Preview not ready yet, waiting..." && sleep 30 && curl -f "$PREVIEW_URL")
          curl -f "$PREVIEW_URL/hello"

  tests:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

  build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean package -Dmaven.test.skip=true